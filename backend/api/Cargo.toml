[package]
name = "api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[[bin]]
name = "gen-openapi"
path = "src/bin/gen_openapi.rs"

[dependencies]
sdlc-shared = { path = "../../../services-base/crates/sdlc-shared" }
# Fleet auth core + central login proxy: sibling services-base checkout.
sdlc-auth-core = { path = "../../../services-base/crates/sdlc-auth-core" }
shared = { path = "../shared" }
domain = { path = "../domain" }
app = { path = "../app" }
axum.workspace = true
axum-extra = { version = "0.10", features = ["cookie"] }
tokio.workspace = true
futures-util.workspace = true
tokio-stream.workspace = true
tower.workspace = true
tower-http.workspace = true
tower_governor.workspace = true
governor.workspace = true
axum-prometheus.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
tracing.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-swagger-ui.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
time = { version = "=0.3.41", features = ["std"] }
urlencoding = "2"

# Fleet auth core + central login proxy (sibling services-base checkout).
reqwest.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower.workspace = true
serde_json.workspace = true
uuid.workspace = true
jsonwebtoken = { workspace = true }
