[workspace]
members = ["api", "app", "domain", "infra", "shared", "server", "cli", "migration"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["FerrPOINT <https://github.com/FerrPOINT>"]
license-file = "LICENSE"
repository = "https://github.com/FerrPOINT/fleet-control"

[workspace.dependencies]
# runtime
axum = { version = "0.8.3", features = ["macros", "multipart"] }
tokio = { version = "1.44", features = ["full"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.15"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs", "set-header"] }
tower_governor = "0.8"
governor = "0.10"
axum-prometheus = "0.10"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# db
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-json", "with-uuid", "with-chrono", "mock"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "with-json", "with-uuid", "with-chrono"] }
# auth
argon2 = "0.5"
# rand_core OsRng for salt generation (argon2 re-exports password_hash::rand_core)
rand_core = { version = "0.6", features = ["getrandom"] }
jsonwebtoken = "9.3"
sha2 = "0.10"
hex = "0.4"
# validation
validator = { version = "0.19", features = ["derive"] }
# errors
thiserror = "2.0"
anyhow = "1.0"
# testing
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
proptest = "1.11"
# cli
clap = { version = "4.5", features = ["derive"] }
# shared
uuid = { version = "1.16", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# web
http = "1.3"
# openapi
utoipa = { version = "5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }
async-trait = "0.1"
moka = { version = "0.12", features = ["future"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls", "tracing", "ring", "webpki-roots"] }
