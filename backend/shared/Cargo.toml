[package]
name = "shared"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[features]
default = ["runtime"]
runtime = ["sdlc-shared/http", "dep:config", "dep:sdlc-telemetry", "dep:tracing-subscriber"]

[dependencies]
# Fleet shared primitives: sibling services-base checkout.
sdlc-telemetry = { path = "../../../services-base/crates/sdlc-telemetry", optional = true }
sdlc-shared = { path = "../../../services-base/crates/sdlc-shared", default-features = false }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
config = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower.workspace = true
