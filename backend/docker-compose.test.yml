services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fleet_control
      POSTGRES_PASSWORD: ${FLEET_CONTROL_TEST_DB_PASSWORD:-fleet_control_test_password}
      POSTGRES_DB: fleet_control_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${FLEET_CONTROL_TEST_DB_PORT:-3458}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_control -d fleet_control_test"]
      interval: 1s
      timeout: 5s
      retries: 30

  redis-test:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${FLEET_CONTROL_TEST_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 5s
      retries: 30
