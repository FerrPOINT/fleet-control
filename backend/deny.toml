# cargo-deny configuration
# Run: cargo deny check
[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste v1 is unmaintained (RUSTSEC-2024-0436); transitive build-dep of
    # utoipa-axum 0.2 (macro-only, not linked into the binary). No safe
    # upgrade exists; revisit when utoipa-axum drops it.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Third-party dependency allowlist only. It does not license FerrPOINT-owned code.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "0BSD",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
