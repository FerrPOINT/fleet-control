version: 1
defaults:
  image: rust:1.88
  timeout: 30m
jobs:
  build:
    commands:
      - cd backend && cargo build --workspace
  test:
    needs: [build]
    commands:
      - cd backend && cargo test --workspace
  fmt:
    needs: [build]
    commands:
      - cd backend && rustup component add rustfmt && cargo fmt --all -- --check
