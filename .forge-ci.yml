version: 1
defaults:
  image: rust:1.88.0
  timeout: 30m
jobs:
  build:
    commands:
      - python3 /runner-sources/services-base/scripts/verify_base_revision.py --revision .base-revision --base /runner-sources/services-base
      - ln -sfn /runner-sources/services-base ../services-base
      - cd backend && cargo build --locked --workspace
  test:
    needs: [build]
    commands:
      - python3 /runner-sources/services-base/scripts/verify_base_revision.py --revision .base-revision --base /runner-sources/services-base
      - ln -sfn /runner-sources/services-base ../services-base
      - cd backend && cargo test --locked --workspace
  fmt:
    needs: [build]
    commands:
      - python3 /runner-sources/services-base/scripts/verify_base_revision.py --revision .base-revision --base /runner-sources/services-base
      - ln -sfn /runner-sources/services-base ../services-base
      - cp -r /usr/local/rustup /tmp/rustup
      - cd backend
      - RUSTUP_HOME=/tmp/rustup rustup component add rustfmt
      - export PATH=/tmp/rustup/toolchains/1.88.0-x86_64-unknown-linux-gnu/bin:$PATH
      - cargo fmt --all -- --check
