version: 1
defaults:
  image: rust:1.88
  timeout: 30m
jobs:
  build:
    commands:
      - cp -r /workspaces/services-base-src ../services-base
      - cd backend && cargo build --workspace
  test:
    needs: [build]
    commands:
      - cp -r /workspaces/services-base-src ../services-base
      - cd backend && cargo test --workspace
  fmt:
    needs: [build]
    commands:
      - cp -r /workspaces/services-base-src ../services-base
      - cp -r /usr/local/rustup /tmp/rustup
      - cd backend && RUSTUP_HOME=/tmp/rustup rustup component add rustfmt
      - cd backend && /tmp/rustup/toolchains/*/bin/cargo fmt --all -- --check
