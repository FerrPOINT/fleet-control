name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # fmt + clippy + test via the shared fleet gate (services-base).
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleet-control/backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: fleet-control
      - name: Check out services-base sibling (path deps)
        uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fleet-control/backend
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --test-threads=1

  openapi-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleet-control/backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: fleet-control
      - name: Check out services-base sibling (path deps)
        uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fleet-control/backend
      - name: Regenerate OpenAPI
        run: |
          mkdir -p ../openapi
          cargo run -p api --bin gen-openapi > ../openapi/openapi.json.generated
      - name: Check committed spec matches code
        run: diff -u ../openapi/openapi.json ../openapi/openapi.json.generated

  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleet-control/backend
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: fleet_control
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fleet_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet_control -d fleet_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: fleet-control
      # Fleet shared crates live in a sibling services-base checkout
      # (api path dep: ../../../services-base/crates/sdlc-auth-core).
      - uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Apply all migrations to clean DB
        run: cargo run -p migration -- up
        env:
          DATABASE_URL: postgres://fleet_control:test@localhost:5432/fleet_control
      - name: Verify migration status
        run: cargo run -p migration -- status
        env:
          DATABASE_URL: postgres://fleet_control:test@localhost:5432/fleet_control

  # install + test + lint + build via the shared fleet gate.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleet-control/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          path: fleet-control
      - name: Check out services-base sibling (@sdlc/ui file dep)
        uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fleet-control/frontend/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
        env:
          CI: "true"
      - run: pnpm openapi:check
      - run: pnpm test -- --run
      - run: pnpm lint
      - run: pnpm build

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fleet-control
      - name: Check out services-base sibling (path deps)
        uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: fleet-control/backend/Cargo.toml
          arguments: --all-features

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleet-control/backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: fleet-control
      - name: Check out services-base sibling (path deps)
        uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fleet-control/backend
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0436

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fleet-control/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          path: fleet-control
      - name: Check out services-base sibling (@sdlc/ui file dep)
        uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fleet-control/frontend/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
        env:
          CI: "true"
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright against vite preview
        run: |
          pnpm exec vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4173/ >/dev/null 2>&1 && break
            sleep 1
          done
          PLAYWRIGHT_BASE_URL=http://localhost:4173 pnpm exec playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fleet-control-playwright-traces
          path: fleet-control/frontend/test-results
          retention-days: 5

