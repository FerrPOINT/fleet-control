name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: fleet-control
      - name: README validator tests
        working-directory: fleet-control
        run: python3 -m unittest scripts.tests.test_verify_readme
      - name: README structural validation
        working-directory: fleet-control
        run: python3 scripts/verify_readme.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fleet-control/backend
    steps:
      - uses: actions/checkout@v7
        with:
          path: fleet-control
      - name: Check out services-base sibling (path deps)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fleet-control/backend
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --test-threads=1
      - name: OpenAPI drift gate
        run: |
          mkdir -p ../openapi
          cargo run -p api --bin gen-openapi > ../openapi/openapi.json.generated
          diff -u ../openapi/openapi.json ../openapi/openapi.json.generated

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fleet-control/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          path: fleet-control
      - name: Check out services-base sibling (@sdlc/ui file dep)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fleet-control/frontend/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
        env:
          CI: "true"
      - run: pnpm openapi:check
      - run: pnpm test -- --run
      - run: pnpm lint
      - run: pnpm build
