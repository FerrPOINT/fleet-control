name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # fmt + clippy + test via the shared fleet gate (services-base).
  backend:
    uses: FerrPOINT/services-base/.github/workflows/backend-gate.yml@main
    with:
      working-directory: backend
      checkout-path: fleet-control
      services-base-sibling: true
      apt-packages: "pkg-config libssl-dev"
  openapi-check:
    uses: FerrPOINT/services-base/.github/workflows/openapi-gate.yml@main
    with:
      checkout-path: fleet-control
      bin: gen-openapi
      spec: openapi/openapi.json
      services-base-sibling: true

  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleet-control/backend
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: fleet_control
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fleet_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet_control -d fleet_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: fleet-control
      # Fleet shared crates live in a sibling services-base checkout
      # (api path dep: ../../../services-base/crates/sdlc-auth-core).
      - uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Apply all migrations to clean DB
        run: cargo run -p migration -- up
        env:
          DATABASE_URL: postgres://fleet_control:test@localhost:5432/fleet_control
      - name: Verify migration status
        run: cargo run -p migration -- status
        env:
          DATABASE_URL: postgres://fleet_control:test@localhost:5432/fleet_control

  # install + test + lint + build via the shared fleet gate.
  frontend:
    uses: FerrPOINT/services-base/.github/workflows/frontend-gate.yml@main
    with:
      working-directory: frontend
      checkout-path: fleet-control
      services-base-sibling: true
      pretest: "pnpm typecheck"
