name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: fleet-control
    steps:
      - uses: actions/checkout@v7
        with:
          path: fleet-control
      - name: Read pinned Base revision
        id: base
        run: echo "sha=$(cat .base-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: ${{ steps.base.outputs.sha }}
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - name: Verify pinned Base checkout
        run: python3 ../services-base/scripts/verify_base_revision.py --revision .base-revision --base ../services-base
      - name: Disposable Compose credentials
        run: |
          for key in POSTGRES_PASSWORD FLEET_CONTROL_JWT_SECRET FLEET_CONTROL_FLEET__RUNTIME_TOKEN_SECRET; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
          echo "BACKEND_PORT=55491" >> "$GITHUB_ENV"
          echo "FRONTEND_PORT=55492" >> "$GITHUB_ENV"
      - name: Build and start clean Compose stack
        run: docker compose -p fleet-ci up -d --build --wait --wait-timeout 120
      - name: Authenticated container acceptance
        run: python3 scripts/compose_smoke.py --url http://127.0.0.1:55492 --compose-project fleet-ci
      - name: Container status
        if: always()
        run: docker compose -p fleet-ci ps -a
      - name: Remove only disposable CI stack
        if: always()
        run: docker compose -p fleet-ci down --volumes --remove-orphans

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: fleet-control
      - name: README validator tests
        working-directory: fleet-control
        run: python3 -m unittest scripts.tests.test_verify_readme
      - name: README structural validation
        working-directory: fleet-control
        run: python3 scripts/verify_readme.py
      - name: Sealed container utility loader contracts (no Docker)
        working-directory: fleet-control
        run: python3 -B -m unittest scripts.tests.test_container_control_loader scripts.tests.test_verify_container_utilities -v

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: fleet_control
          POSTGRES_PASSWORD: fleet_control
          POSTGRES_DB: fleet_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet_control -d fleet_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLEET_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_control_test
      FLEET_MIGRATION_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_control_test
      FLEET_TEST_BASE_PACKAGE_CHECKOUT: ${{ github.workspace }}/base-role-package
    defaults:
      run:
        working-directory: fleet-control/backend
    steps:
      - uses: actions/checkout@v7
        with:
          path: fleet-control
      - name: Read pinned Base revision
        id: base
        working-directory: fleet-control
        run: echo "sha=$(cat .base-revision)" >> "$GITHUB_OUTPUT"
      - name: Check out services-base sibling (path deps)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          ref: ${{ steps.base.outputs.sha }}
      - name: Verify pinned Base checkout
        working-directory: fleet-control
        run: python3 ../services-base/scripts/verify_base_revision.py --revision .base-revision --base ../services-base
      - name: Check out exact Base role package (separate from SDK pin)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: base-role-package
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          ref: 4b9b4c9297a13fb28a6ba2039af2f7cb719f2f58
      - name: Verify canonical Base package input
        working-directory: base-role-package
        run: |
          git remote set-url origin https://github.com/FerrPOINT/services-base.git
          test "$(git config --get remote.origin.url)" = https://github.com/FerrPOINT/services-base.git
          test "$(git rev-parse HEAD)" = 4b9b4c9297a13fb28a6ba2039af2f7cb719f2f58
          git cat-file -e 4b9b4c9297a13fb28a6ba2039af2f7cb719f2f58:agent-skills/manifest.json
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev postgresql-client
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fleet-control/backend
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace -- --test-threads=1
      - name: Configuration foundation focused API regressions
        run: |
          cargo test --locked -p api --lib routes::pm_runtime::tests:: -- --test-threads=1
          cargo test --locked -p api --lib routes::sdlc_configuration::tests:: -- --test-threads=1
      - name: Historical lineage upgrade and central profile preservation
        run: |
          cargo test --locked -p migration --lib lineage_tests -- --include-ignored --test-threads=1
          cargo test --locked -p infra --test central_profile -- --ignored --test-threads=1
      - name: Mandatory original Docker controller contracts and PostgreSQL fences
        env:
          PGPASSWORD: fleet_control
          FLEET_CONTAINER_CONTROLLER_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_container_controller_test
          FLEET_CONTAINER_CONTROLLER_MIGRATION_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_container_controller_migration_test
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_container_controller_test;'
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_container_controller_migration_test;'
          cargo test --locked -p infra --lib runtime::container_control::tests:: -- --test-threads=1 | tee "$RUNNER_TEMP/container-control-unit.log"
          grep -F 'test result: ok. 9 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/container-control-unit.log"
          cargo test --locked -p infra --lib runtime::container_lifecycle::tests:: -- --test-threads=1 | tee "$RUNNER_TEMP/container-lifecycle-unit.log"
          grep -F 'test result: ok. 4 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/container-lifecycle-unit.log"
          cargo test --locked -p infra --test container_controller -- --ignored --test-threads=1 | tee "$RUNNER_TEMP/container-controller-pg.log"
          grep -F 'test result: ok. 6 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/container-controller-pg.log"
          cargo test --locked -p migration --test container_controller -- --ignored --test-threads=1 | tee "$RUNNER_TEMP/container-controller-migration.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/container-controller-migration.log"
      - name: Mandatory mapped-volume and controller recovery contracts
        env:
          PGPASSWORD: fleet_control
          FLEET_MAPPED_CONTROLLER_MIGRATION_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_mapped_controller_migration_test
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_mapped_controller_migration_test;'
          cargo test --locked -p infra --lib runtime::container_mapping::tests:: -- --test-threads=1 | tee "$RUNNER_TEMP/container-mapping-unit.log"
          grep -F 'test result: ok. 6 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/container-mapping-unit.log"
          cargo test --locked -p infra --lib runtime::container_control::mapped_tests:: -- --test-threads=1 | tee "$RUNNER_TEMP/controller-recovery-unit.log"
          grep -F 'test result: ok. 6 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/controller-recovery-unit.log"
          cargo test --locked -p infra --lib runtime::container_recovery::tests:: -- --test-threads=1 | tee "$RUNNER_TEMP/controller-recovery-loop-unit.log"
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/controller-recovery-loop-unit.log"
          cargo test --locked -p infra --lib runtime::container_workers::tests:: -- --test-threads=1 | tee "$RUNNER_TEMP/container-agent-isolation-unit.log"
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/container-agent-isolation-unit.log"
          cargo test --locked -p migration --test mapped_controller_recovery -- --ignored --test-threads=1 | tee "$RUNNER_TEMP/controller-recovery-migration.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/controller-recovery-migration.log"
      - name: Check out original runtime utilities separately from SDK
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: fleet-runtime-contract-base
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          ref: 9b53de7b23593949a9e6c05bd5a4f94b930e50a0
      - name: Mandatory automatic preparation, original readback and PG permits
        env:
          PGPASSWORD: fleet_control
          FLEET_CONTAINER_PREPARATION_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_container_preparation_test
          FLEET_CONTAINER_PREPARATION_MIGRATION_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_container_preparation_migration_test
        run: |
          set -euo pipefail
          python3 -B ../scripts/check_container_preparation_contract.py --base ../../fleet-runtime-contract-base
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_container_preparation_test;'
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_container_preparation_migration_test;'
          cargo test --locked -p infra --lib runtime::container_preparation_tests:: -- --test-threads=1 | tee "$RUNNER_TEMP/container-preparation-adapter.log"
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/container-preparation-adapter.log"
          cargo test --locked -p infra --lib runtime::container_preparation::tests:: -- --test-threads=1 | tee "$RUNNER_TEMP/container-preparation-intent.log"
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/container-preparation-intent.log"
          cargo test --locked -p infra --lib tests::docker_bootstrap_projection_preserves_process_and_java_paths -- --exact | tee "$RUNNER_TEMP/container-preparation-projection.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/container-preparation-projection.log"
          cargo test --locked -p infra --test container_preparation -- --ignored --test-threads=1 | tee "$RUNNER_TEMP/container-preparation-pg.log"
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/container-preparation-pg.log"
          cargo test --locked -p migration --test container_preparation -- --ignored --test-threads=1 | tee "$RUNNER_TEMP/container-preparation-migration.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/container-preparation-migration.log"
      - name: Mandatory Docker activation, exact rollback and original Base readback
        env:
          PGPASSWORD: fleet_control
          FLEET_CONTAINER_ACTIVATION_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_container_activation_test
          FLEET_CONTAINER_ACTIVATION_MIGRATION_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_container_activation_migration_test
          FLEET_RECOVERED_ACTIVATION_MIGRATION_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_recovered_activation_migration_test
        run: |
          set -euo pipefail
          python3 -B ../scripts/check_container_activation_contract.py --base ../../fleet-runtime-contract-base
          python3 -B ../scripts/check_recovered_activation_contract.py --base ../../fleet-runtime-contract-base
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_container_activation_test;'
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_container_activation_migration_test;'
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_recovered_activation_migration_test;'
          cargo test --locked -p infra --lib runtime::container_replacement::tests:: -- --test-threads=1 | tee "$RUNNER_TEMP/container-replacement-unit.log"
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/container-replacement-unit.log"
          cargo test --locked -p app --lib container_activation::tests:: -- --test-threads=1 | tee "$RUNNER_TEMP/container-activation-state.log"
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/container-activation-state.log"
          cargo test --locked -p infra --lib runtime::container_activation::tests:: -- --test-threads=1 | tee "$RUNNER_TEMP/container-activation-intent.log"
          grep -F 'test result: ok. 18 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/container-activation-intent.log"
          for test in workflow_preflight_selects_immutable_target_for_fresh_and_resumed_forward_phases workflow_rollback_preflight_selects_current_effective_not_desired_or_root_revision workflow_preflight_never_rebinds_foreign_activation_or_changed_revision workflow_owner_http_failure_is_read_only_and_never_enters_package_or_native_io; do
            grep -Fx "test runtime::container_activation::tests::$test ... ok" "$RUNNER_TEMP/container-activation-intent.log"
          done
          grep -Fx 'test runtime::container_activation::tests::successor_plan_keeps_original_anchor_and_rolls_back_to_current_effective ... ok' "$RUNNER_TEMP/container-activation-intent.log"
          grep -Fx 'test runtime::container_activation::tests::successor_command_uses_exact_current_child_stop_not_root_stop ... ok' "$RUNNER_TEMP/container-activation-intent.log"
          cargo test --locked -p infra --test container_activation -- --ignored --test-threads=1 | tee "$RUNNER_TEMP/container-activation-pg.log"
          grep -F 'test result: ok. 13 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/container-activation-pg.log"
          for selector in recovered_committed_child_next_activation_and_failure_rollback_keep_original_anchor recovered_rolled_back_child_next_activation_and_failure_rollback_keep_original_anchor recovered_next_claim_rejects_foreign_lineage_unknown_lease_and_duplicate_plan recovered_next_claim_expiry_and_new_epoch_require_latest_original_authority; do
            grep -Fx "test $selector ... ok" "$RUNNER_TEMP/container-activation-pg.log"
          done
          cargo test --locked -p migration --test container_activation -- --ignored --test-threads=1 | tee "$RUNNER_TEMP/container-activation-migration.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/container-activation-migration.log"
          cargo test --locked -p migration --test recovered_activation -- --ignored --test-threads=1 | tee "$RUNNER_TEMP/recovered-activation-migration.log"
          grep -Fx 'test recovered_activation_additive_roundtrip_preserves_original_recovery_guard_and_ledger ... ok' "$RUNNER_TEMP/recovered-activation-migration.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/recovered-activation-migration.log"
      - name: Mandatory Hermes journal, atomic ACK and GET-only recovery
        env:
          PGPASSWORD: fleet_control
          FLEET_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_hermes_journal_test
          FLEET_DISPATCH_JOURNAL_MIGRATION_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_dispatch_journal_migration_test
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_hermes_journal_test;'
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_dispatch_journal_migration_test;'
          focused() {
            cargo test --locked -p infra --test sdlc_foundation "$1" -- --ignored --test-threads=1 | tee "$RUNNER_TEMP/$2.log"
            grep -F "test result: ok. $3 passed; 0 failed; 0 ignored;" "$RUNNER_TEMP/$2.log"
          }
          focused hermes_dispatch_journal:: journal 16
          grep -Fx 'test hermes_dispatch_journal::journal_clock_regression_keeps_logical_progress_without_renewing_horizon ... ok' "$RUNNER_TEMP/journal.log"
          focused runtime_acceptance:: acceptance 11
          focused runtime_acceptance_readback_http:: recovery 5
          focused runtime_http_ terminal 8
          cargo test --locked -p migration --test hermes_dispatch_journal -- --ignored --test-threads=1 | tee "$RUNNER_TEMP/journal-migration.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/journal-migration.log"
      - name: Mandatory original-key recovery, pinned terminal atomicity and framing
        env:
          PGPASSWORD: fleet_control
        run: |
          set -euo pipefail
          focused() {
            local family="$1" count="$2" database="fleet_${1}_test"
            psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $database;"
            FLEET_TEST_DATABASE_URL="postgres://fleet_control:fleet_control@127.0.0.1:5432/$database" \
              cargo test --locked -p infra --test sdlc_foundation "$family::" -- --ignored --test-threads=1 2>&1 | tee "$RUNNER_TEMP/$family.log"
            grep -F "test result: ok. $count passed; 0 failed; 0 ignored;" "$RUNNER_TEMP/$family.log"
          }
          focused runtime_pinned_recovery 5
          focused runtime_unknown_recovery 2
          focused runtime_recovery_races 2
          focused runtime_stream_bounds 7
          cargo test --locked -p infra --lib runtime::recovery_wire::tests:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/recovery-wire.log"
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/recovery-wire.log"
          cargo test --locked -p infra --lib runtime::sse_wire::tests:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/sse-wire.log"
          grep -F 'test result: ok. 10 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/sse-wire.log"
      - name: Mandatory durable runtime controls and atomic terminal mirror
        env:
          PGPASSWORD: fleet_control
          FLEET_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_runtime_controls_test
          FLEET_RUNTIME_CONTROL_MIGRATION_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_runtime_controls_migration_test
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_runtime_controls_test;'
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_runtime_controls_migration_test;'
          cargo test --locked -p api --lib routes::sessions::tests::runtime_controls_require_one_bounded_key_and_derive_the_actor -- --exact | tee "$RUNNER_TEMP/control-api.log"
          grep -Fx 'test routes::sessions::tests::runtime_controls_require_one_bounded_key_and_derive_the_actor ... ok' "$RUNNER_TEMP/control-api.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/control-api.log"
          cargo test --locked -p api --lib routes::sessions::tests::runtime_control_lookup_requires_bounded_unambiguous_header_without_echo -- --exact | tee "$RUNNER_TEMP/control-lookup-header.log"
          grep -Fx 'test routes::sessions::tests::runtime_control_lookup_requires_bounded_unambiguous_header_without_echo ... ok' "$RUNNER_TEMP/control-lookup-header.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/control-lookup-header.log"
          cargo test --locked -p api --lib tests::runtime_control_lookup_openapi_requires_key_and_returns_one_receipt -- --exact | tee "$RUNNER_TEMP/control-lookup-openapi.log"
          grep -Fx 'test tests::runtime_control_lookup_openapi_requires_key_and_returns_one_receipt ... ok' "$RUNNER_TEMP/control-lookup-openapi.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/control-lookup-openapi.log"
          cargo test --locked -p api --lib tests::runtime_control_lookup_literal_route_cannot_be_an_old_uuid_receipt -- --exact | tee "$RUNNER_TEMP/control-lookup-route.log"
          grep -Fx 'test tests::runtime_control_lookup_literal_route_cannot_be_an_old_uuid_receipt ... ok' "$RUNNER_TEMP/control-lookup-route.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/control-lookup-route.log"
          cargo test --locked -p infra --lib runtime::run_control::tests:: | tee "$RUNNER_TEMP/control-wire.log"
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/control-wire.log"
          grep -Fx 'test runtime::run_control::tests::steer_requires_exact_native_ack_and_true_boolean ... ok' "$RUNNER_TEMP/control-wire.log"
          grep -Fx 'test runtime::run_control::tests::stop_ack_is_not_terminal_or_capacity_release ... ok' "$RUNNER_TEMP/control-wire.log"
          grep -Fx 'test runtime::run_control::tests::terminal_stop_race_requires_full_pinned_native_status ... ok' "$RUNNER_TEMP/control-wire.log"
          cargo test --locked -p infra --test sdlc_foundation runtime_run_control:: -- --ignored --test-threads=1 | tee "$RUNNER_TEMP/control-pg.log"
          grep -F 'test result: ok. 30 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/control-pg.log"
          grep -Fx 'test runtime_run_control::key_lookup::original_key_lookup_is_scoped_read_only_and_not_limited_to_latest100 ... ok' "$RUNNER_TEMP/control-pg.log"
          grep -Fx 'test runtime_run_control::key_lookup::lookup_http_auth_header_scope_and_single_receipt_never_fall_back_to_list ... ok' "$RUNNER_TEMP/control-pg.log"
          grep -Fx 'test runtime_run_control::key_lookup::lookup_http_sessionless_principal_and_forged_header_are_denied ... ok' "$RUNNER_TEMP/control-pg.log"
          grep -Fx 'test runtime_run_control::key_lookup::lookup_http_existing_project_guard_denies_unavailable_binding ... ok' "$RUNNER_TEMP/control-pg.log"
          grep -Fx 'test runtime_run_control::key_lookup::concurrent_original_key_reads_race_claim_without_mutation_or_new_permit ... ok' "$RUNNER_TEMP/control-pg.log"
          grep -Fx 'test runtime_run_control::steer_transcript::ack_preserves_actor_redaction_scope_and_one_mirror_per_receipt ... ok' "$RUNNER_TEMP/control-pg.log"
          grep -Fx 'test runtime_run_control::steer_transcript::acknowledged_replay_repairs_legacy_mirror_without_native_post ... ok' "$RUNNER_TEMP/control-pg.log"
          grep -Fx 'test runtime_run_control::steer_transcript::uncertain_and_rejected_never_mirror_or_repost ... ok' "$RUNNER_TEMP/control-pg.log"
          grep -Fx 'test runtime_run_control::steer_transcript::ack_payload_proof_denies_missing_or_changed_input ... ok' "$RUNNER_TEMP/control-pg.log"
          grep -Fx 'test runtime_run_control::steer_transcript::audit_failure_rolls_back_ack_mirror_preview_and_events ... ok' "$RUNNER_TEMP/control-pg.log"
