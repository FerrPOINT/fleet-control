name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: fleet-control
    steps:
      - uses: actions/checkout@v7
        with:
          path: fleet-control
      - name: Read pinned Base revision
        id: base
        run: echo "sha=$(cat .base-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: ${{ steps.base.outputs.sha }}
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - name: Verify pinned Base checkout
        run: python3 ../services-base/scripts/verify_base_revision.py --revision .base-revision --base ../services-base
      - name: Disposable Compose credentials
        run: |
          for key in POSTGRES_PASSWORD FLEET_CONTROL_JWT_SECRET FLEET_CONTROL_FLEET__RUNTIME_TOKEN_SECRET; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
          echo "BACKEND_PORT=55491" >> "$GITHUB_ENV"
          echo "FRONTEND_PORT=55492" >> "$GITHUB_ENV"
      - name: Build and start clean Compose stack
        run: docker compose -p fleet-ci up -d --build --wait --wait-timeout 120
      - name: Authenticated container acceptance
        run: python3 scripts/compose_smoke.py --url http://127.0.0.1:55492 --compose-project fleet-ci
      - name: Container status
        if: always()
        run: docker compose -p fleet-ci ps -a
      - name: Remove only disposable CI stack
        if: always()
        run: docker compose -p fleet-ci down --volumes --remove-orphans

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: fleet-control
      - name: README validator tests
        working-directory: fleet-control
        run: python3 -m unittest scripts.tests.test_verify_readme
      - name: README structural validation
        working-directory: fleet-control
        run: python3 scripts/verify_readme.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: fleet_control
          POSTGRES_PASSWORD: fleet_control
          POSTGRES_DB: fleet_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet_control -d fleet_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLEET_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_control_test
      FLEET_MIGRATION_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_control_test
      FLEET_TEST_BASE_PACKAGE_CHECKOUT: ${{ github.workspace }}/base-role-package
    defaults:
      run:
        working-directory: fleet-control/backend
    steps:
      - uses: actions/checkout@v7
        with:
          path: fleet-control
      - name: Read pinned Base revision
        id: base
        working-directory: fleet-control
        run: echo "sha=$(cat .base-revision)" >> "$GITHUB_OUTPUT"
      - name: Check out services-base sibling (path deps)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          ref: ${{ steps.base.outputs.sha }}
      - name: Verify pinned Base checkout
        working-directory: fleet-control
        run: python3 ../services-base/scripts/verify_base_revision.py --revision .base-revision --base ../services-base
      - name: Check out exact Base role package (separate from SDK pin)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: base-role-package
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          ref: 4b9b4c9297a13fb28a6ba2039af2f7cb719f2f58
      - name: Verify canonical Base package input
        working-directory: base-role-package
        run: |
          git remote set-url origin https://github.com/FerrPOINT/services-base.git
          test "$(git config --get remote.origin.url)" = https://github.com/FerrPOINT/services-base.git
          test "$(git rev-parse HEAD)" = 4b9b4c9297a13fb28a6ba2039af2f7cb719f2f58
          git cat-file -e 4b9b4c9297a13fb28a6ba2039af2f7cb719f2f58:agent-skills/manifest.json
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev postgresql-client
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fleet-control/backend
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace -- --test-threads=1
      - name: Configuration foundation focused API regressions
        run: |
          cargo test --locked -p api --lib routes::pm_runtime::tests:: -- --test-threads=1
          cargo test --locked -p api --lib routes::sdlc_configuration::tests:: -- --test-threads=1
      - name: Historical lineage upgrade and central profile preservation
        run: |
          cargo test --locked -p migration --lib lineage_tests -- --include-ignored --test-threads=1
          cargo test --locked -p infra --test central_profile -- --ignored --test-threads=1
      - name: Isolated directory and approval SSE acceptance
        env:
          PGPASSWORD: fleet_control
          FLEET_CHATS_DIRECTORY_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_chats_directory_test
          FLEET_RUNTIME_APPROVAL_EVENTS_TEST_DATABASE_URL: postgres://fleet_approval_events_test:ci-test-only@127.0.0.1:5432/fleet_runtime_approval_events_test
        run: |
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_chats_directory_test;'
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE fleet_approval_events_test LOGIN PASSWORD 'ci-test-only';"
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_runtime_approval_events_test OWNER fleet_approval_events_test;'
          cargo test --locked -p infra --test chats_directory -- --ignored --test-threads=1
          cargo test --locked -p infra --test runtime_approval_events -- --ignored --test-threads=1
      - name: Clean migration up, rollback new revisions and reapply
        env:
          PGPASSWORD: fleet_control
          DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_migration_smoke
        run: |
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_migration_smoke;'
          cargo run --locked -p migration -- up
          cargo run --locked -p migration -- status
          cargo run --locked -p migration -- down -n 1
          cargo run --locked -p migration -- up
          cargo run --locked -p migration -- status
      - name: Historical transcript migration and clock rollback
        env:
          PGPASSWORD: fleet_control
          FLEET_MESSAGE_ORDER_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_message_order_test
        run: |
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_message_order_test;'
          cargo test --locked -p migration --test message_order -- --ignored --test-threads=1
      - name: OpenAPI drift gate
        run: |
          mkdir -p ../openapi
          cargo run --locked -p api --bin gen-openapi > ../openapi/openapi.json.generated
          diff -u ../openapi/openapi.json ../openapi/openapi.json.generated

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fleet-control/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          path: fleet-control
      - name: Read pinned Base revision
        id: base
        working-directory: fleet-control
        run: echo "sha=$(cat .base-revision)" >> "$GITHUB_OUTPUT"
      - name: Check out services-base sibling (@sdlc/ui file dep)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          ref: ${{ steps.base.outputs.sha }}
      - name: Verify pinned Base checkout
        working-directory: fleet-control
        run: python3 ../services-base/scripts/verify_base_revision.py --revision .base-revision --base ../services-base
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          cache: pnpm
          cache-dependency-path: fleet-control/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        env:
          CI: "true"
      - run: pnpm openapi:check
      - run: pnpm chat:contract
      - run: pnpm chat:evidence:verify
      - name: Install shared UI validator dependencies
        run: pnpm --dir ../../services-base/frontend install --frozen-lockfile
        env:
          CI: "true"
      - run: pnpm ui:check
      - run: pnpm markdown:check
      - run: pnpm screenshots:verify
      - run: pnpm typecheck
      - run: pnpm test -- --run
      - run: pnpm lint
      - name: OpenAPI compatibility against target branch
        run: |
          git fetch origin main --depth=1
          pnpm openapi:compat
      - name: Generated contract and lockfile stay unchanged
        run: git diff --exit-code -- pnpm-lock.yaml src/api/generated.ts src/api/schema.d.ts
      - run: pnpm build
      - name: Packed Base consumer
        run: python ../../services-base/scripts/check_ui_consumer.py
      - name: Effective themes in the built consumer
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/theme-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; wait "$preview_pid" 2>/dev/null || true' EXIT
          pnpm theme:check http://127.0.0.1:4173

      - run: pnpm format:check
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Three-browser fixture acceptance
        run: pnpm exec playwright test
      - name: Capture current fixture screens
        run: pnpm screenshots:local
      - name: Verify generated screenshot manifest
        run: pnpm screenshots:verify
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fleet-browser-evidence
          path: |
            fleet-control/frontend/test-results
            fleet-control/docs/assets/screens
          retention-days: 14

  minimum-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: fleet-control
      - name: Read pinned Base revision
        id: base
        working-directory: fleet-control
        run: echo "sha=$(cat .base-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: ${{ steps.base.outputs.sha }}
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - name: Verify pinned Base checkout
        working-directory: fleet-control
        run: python3 ../services-base/scripts/verify_base_revision.py --revision .base-revision --base ../services-base
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fleet-control/backend
      - name: Check declared minimum independently of release builds
        working-directory: fleet-control/backend
        run: cargo check --locked --workspace --all-targets
