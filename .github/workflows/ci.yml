name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: fleet-control
    steps:
      - uses: actions/checkout@v7
        with:
          path: fleet-control
      - name: Read pinned Base revision
        id: base
        run: echo "sha=$(cat .base-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: ${{ steps.base.outputs.sha }}
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - name: Verify pinned Base checkout
        run: python3 ../services-base/scripts/verify_base_revision.py --revision .base-revision --base ../services-base
      - name: Disposable Compose credentials
        run: |
          for key in POSTGRES_PASSWORD FLEET_CONTROL_JWT_SECRET FLEET_CONTROL_FLEET__RUNTIME_TOKEN_SECRET; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
          echo "BACKEND_PORT=55491" >> "$GITHUB_ENV"
          echo "FRONTEND_PORT=55492" >> "$GITHUB_ENV"
      - name: Build and start clean Compose stack
        run: docker compose -p fleet-ci up -d --build --wait --wait-timeout 120
      - name: Authenticated container acceptance
        run: python3 scripts/compose_smoke.py --url http://127.0.0.1:55492 --compose-project fleet-ci
      - name: Container status
        if: always()
        run: docker compose -p fleet-ci ps -a
      - name: Remove only disposable CI stack
        if: always()
        run: docker compose -p fleet-ci down --volumes --remove-orphans

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: fleet-control
      - name: README validator tests
        working-directory: fleet-control
        run: python3 -m unittest scripts.tests.test_verify_readme
      - name: README structural validation
        working-directory: fleet-control
        run: python3 scripts/verify_readme.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: fleet_control
          POSTGRES_PASSWORD: fleet_control
          POSTGRES_DB: fleet_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet_control -d fleet_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLEET_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_control_test
      FLEET_MIGRATION_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_control_test
      FLEET_TEST_BASE_PACKAGE_CHECKOUT: ${{ github.workspace }}/base-role-package
    defaults:
      run:
        working-directory: fleet-control/backend
    steps:
      - uses: actions/checkout@v7
        with:
          path: fleet-control
      - name: Read pinned Base revision
        id: base
        working-directory: fleet-control
        run: echo "sha=$(cat .base-revision)" >> "$GITHUB_OUTPUT"
      - name: Check out services-base sibling (path deps)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          ref: ${{ steps.base.outputs.sha }}
      - name: Verify pinned Base checkout
        working-directory: fleet-control
        run: python3 ../services-base/scripts/verify_base_revision.py --revision .base-revision --base ../services-base
      - name: Check out exact Base role package (separate from SDK pin)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: base-role-package
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          ref: 4b9b4c9297a13fb28a6ba2039af2f7cb719f2f58
      - name: Verify canonical Base package input
        working-directory: base-role-package
        run: |
          git remote set-url origin https://github.com/FerrPOINT/services-base.git
          test "$(git config --get remote.origin.url)" = https://github.com/FerrPOINT/services-base.git
          test "$(git rev-parse HEAD)" = 4b9b4c9297a13fb28a6ba2039af2f7cb719f2f58
          git cat-file -e 4b9b4c9297a13fb28a6ba2039af2f7cb719f2f58:agent-skills/manifest.json
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev postgresql-client
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fleet-control/backend
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace -- --test-threads=1
      - name: Configuration foundation focused API regressions
        run: |
          cargo test --locked -p api --lib routes::pm_runtime::tests:: -- --test-threads=1
          cargo test --locked -p api --lib routes::sdlc_configuration::tests:: -- --test-threads=1
      - name: Persisted PM credential unit and PostgreSQL recovery regressions
        run: |
          set -euo pipefail
          test -n "$FLEET_TEST_DATABASE_URL"
          cargo test --locked -p infra --lib pm_credentials:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/credential-unit.log"
          grep -F 'test result: ok. 7 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/credential-unit.log"
          cargo test --locked -p shared --lib config::tests::pm_credentials_default_disabled_and_never_serialize_parent_secret -- --exact --test-threads=1 2>&1 | tee "$RUNNER_TEMP/credential-config.log"
          grep -Fx 'test config::tests::pm_credentials_default_disabled_and_never_serialize_parent_secret ... ok' "$RUNNER_TEMP/credential-config.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/credential-config.log"
          cargo test --locked -p infra --test sdlc_foundation pm_credential_creation:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/credential-pg.log"
          for name in \
            pm_credentials_pg_lost_ack_restart_replays_exact_child_without_run_or_secret \
            pm_credentials_pg_partial_success_keeps_receipt_and_checks_current_context_on_replay \
            pm_credentials_pg_rotated_parent_origins_or_ttl_conflict_before_external_request \
            pm_credentials_pg_concurrent_preparation_freezes_one_receipt_and_rejects_payload_conflict \
            pm_credentials_pg_revoked_child_cannot_be_used \
            pm_credentials_pg_expired_receipt_stops_before_external_renewal \
            pm_credentials_pg_database_guards_monotonic_journal_and_single_redacted_audit \
            pm_credentials_pg_first_intent_and_ack_require_readable_strict_shapes \
            pm_credentials_pg_revoked_parent_prevents_post_and_does_not_erase_ack \
            pm_credentials_pg_audit_failure_rolls_back_journal_and_recovers_original_child; do
            grep -Fx "test pm_credential_creation::$name ... ok" "$RUNNER_TEMP/credential-pg.log"
          done
          grep -F 'test result: ok. 10 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/credential-pg.log"
      - name: Historical lineage upgrade and central profile preservation
        run: |
          cargo test --locked -p migration --lib lineage_tests -- --include-ignored --test-threads=1
          cargo test --locked -p infra --test central_profile -- --ignored --test-threads=1
      - name: Isolated directory and approval SSE acceptance
        env:
          PGPASSWORD: fleet_control
          FLEET_CHATS_DIRECTORY_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_chats_directory_test
          FLEET_RUNTIME_APPROVAL_EVENTS_TEST_DATABASE_URL: postgres://fleet_approval_events_test:ci-test-only@127.0.0.1:5432/fleet_runtime_approval_events_test
        run: |
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_chats_directory_test;'
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE fleet_approval_events_test LOGIN PASSWORD 'ci-test-only';"
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_runtime_approval_events_test OWNER fleet_approval_events_test;'
          cargo test --locked -p infra --test chats_directory -- --ignored --test-threads=1
          cargo test --locked -p infra --test runtime_approval_events -- --ignored --test-threads=1
      - name: Clean migration up, rollback new revisions and reapply
        env:
          PGPASSWORD: fleet_control
          DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_migration_smoke
        run: |
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_migration_smoke;'
          cargo run --locked -p migration -- up
          cargo run --locked -p migration -- status
          cargo run --locked -p migration -- down -n 1
          cargo run --locked -p migration -- up
          cargo run --locked -p migration -- status
      - name: Historical transcript migration and clock rollback
        env:
          PGPASSWORD: fleet_control
          FLEET_MESSAGE_ORDER_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_message_order_test
        run: |
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_message_order_test;'
          cargo test --locked -p migration --test message_order -- --ignored --test-threads=1
      - name: Additive credential migration and legacy downgrade
        env:
          PGPASSWORD: fleet_control
          FLEET_CREDENTIAL_MIGRATION_TEST_DATABASE_URL: postgres://fleet_control:fleet_control@127.0.0.1:5432/fleet_credential_migration_test
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U fleet_control -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE fleet_credential_migration_test;'
          cargo test --locked -p migration --test pm_credentials -- --ignored --test-threads=1 2>&1 | tee "$RUNNER_TEMP/credential-migration.log"
          grep -Fx 'test credentials_additive_upgrade_preserves_legacy_operation_and_empty_downgrade ... ok' "$RUNNER_TEMP/credential-migration.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/credential-migration.log"
      - name: OpenAPI drift gate
        run: |
          mkdir -p ../openapi
          cargo run --locked -p api --bin gen-openapi > ../openapi/openapi.json.generated
          diff -u ../openapi/openapi.json ../openapi/openapi.json.generated

  real-base-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: public.ecr.aws/docker/library/rust@sha256:af306cfa71d987911a781c37b59d7d67d934f49684058f96cf72079c3626bfe0
      options: --cpus 2 --memory 4g
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: fleet_test
          POSTGRES_DB: fleet_real_auth_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --cpus 1 --memory 512m
          --health-cmd "pg_isready -U fleet_test -d fleet_real_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      FLEET_REAL_AUTH_TEST_OWNED: source-qualified-disposable
      FLEET_REAL_AUTH_TEST_SOURCE_SHA: 01388dfb43332cbe5837fd5e1fadccf09cb8886d
      FLEET_REAL_AUTH_TEST_DATABASE_URL: postgres://fleet_test@postgres:5432/fleet_real_auth_test
    steps:
      - uses: actions/checkout@v7
        with:
          path: fleet-control
          persist-credentials: false
      - name: Read build SDK revision
        id: base
        run: echo "sha=$(cat fleet-control/.base-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: ${{ steps.base.outputs.sha }}
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          persist-credentials: false
      - name: Check out real Auth separately from the build SDK
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: base-auth-source
          ref: 01388dfb43332cbe5837fd5e1fadccf09cb8886d
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          persist-credentials: false
      - name: Install compiler prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends pkg-config libssl-dev curl unzip
      - name: Export exact committed sources and record provenance
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = 1.88.0
          test "$(df -PB1 "$RUNNER_TEMP" | awk 'END {print $4}')" -ge 5368709120
          test "$(git -C base-auth-source rev-parse HEAD)" = "$FLEET_REAL_AUTH_TEST_SOURCE_SHA"
          test "$(git -C services-base rev-parse HEAD)" = "$(cat fleet-control/.base-revision)"
          root="$RUNNER_TEMP/pm-auth-source"
          mkdir -p "$root/fleet-control" "$root/services-base" "$root/base-auth-source" "$RUNNER_TEMP/pm-auth-tmp" "$RUNNER_TEMP/pm-auth-evidence"
          git -C fleet-control archive HEAD backend .base-revision openapi | tar -x -C "$root/fleet-control"
          git -C services-base archive HEAD crates Cargo.toml Cargo.lock LICENSE | tar -x -C "$root/services-base"
          git -C base-auth-source archive "$FLEET_REAL_AUTH_TEST_SOURCE_SHA" crates Cargo.toml Cargo.lock LICENSE frontend/src/lib/theme-preference.js | tar -x -C "$root/base-auth-source"
          printf 'fleet=%s\nsdk=%s\nauth=%s\n' "$(git -C fleet-control rev-parse HEAD)" "$(git -C services-base rev-parse HEAD)" "$FLEET_REAL_AUTH_TEST_SOURCE_SHA" > "$RUNNER_TEMP/pm-auth-evidence/source-commits.txt"
          find "$root" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/pm-auth-evidence/sources.sha256"
          echo "TMPDIR=$RUNNER_TEMP/pm-auth-tmp" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/pm-auth-target/fleet" >> "$GITHUB_ENV"
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 0 https://github.com/swagger-api/swagger-ui/archive/refs/tags/v5.17.14.zip --output "$RUNNER_TEMP/swagger.zip"
          printf '%s  %s\n' 481244d0812097b11fbaeef79f71d942b171617f9c9f9514e63acbe13e71ccdc "$RUNNER_TEMP/swagger.zip" | sha256sum --check
          echo "SWAGGER_UI_DOWNLOAD_URL=file://$RUNNER_TEMP/swagger.zip" >> "$GITHUB_ENV"
      - name: Build the qualified real Auth binary
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path "$RUNNER_TEMP/pm-auth-source/base-auth-source/Cargo.toml" --target-dir "$RUNNER_TEMP/pm-auth-target/base" -p auth-server --bin auth-server
          binary="$RUNNER_TEMP/pm-auth-target/base/debug/auth-server"
          sha256sum "$binary" > "$RUNNER_TEMP/pm-auth-evidence/auth-binary.sha256"
          echo "FLEET_REAL_AUTH_TEST_BINARY=$binary" >> "$GITHUB_ENV"
          echo "FLEET_REAL_AUTH_TEST_BINARY_SHA256=$(sha256sum "$binary" | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Require real Fleet issuance replay conflict and revoke
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path "$RUNNER_TEMP/pm-auth-source/fleet-control/backend/Cargo.toml" -p infra --test pm_credentials_real_auth -- --ignored --test-threads=1 > "$RUNNER_TEMP/pm-auth-evidence/consumer.log" 2>&1
          grep -Fx 'test real_base_delegation_wire_replay_conflict_and_revoke_match_fleet ... ok' "$RUNNER_TEMP/pm-auth-evidence/consumer.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/pm-auth-evidence/consumer.log"
          sha256sum --check "$RUNNER_TEMP/pm-auth-evidence/sources.sha256"
          printf 'real_base_delegation_wire_replay_conflict_and_revoke_match_fleet: 1 passed; 0 failed; 0 ignored\n' > "$RUNNER_TEMP/pm-auth-evidence/consumer-result.txt"
      - name: Preserve non-secret source and consumer evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fleet-real-auth-evidence
          path: |
            ${{ runner.temp }}/pm-auth-evidence/source-commits.txt
            ${{ runner.temp }}/pm-auth-evidence/sources.sha256
            ${{ runner.temp }}/pm-auth-evidence/auth-binary.sha256
            ${{ runner.temp }}/pm-auth-evidence/consumer-result.txt
          retention-days: 14
      - name: Remove exact disposable source scratch targets and private log
        if: always()
        run: |
          set -euo pipefail
          test -n "$RUNNER_TEMP" && test "$RUNNER_TEMP" != /
          rm -rf -- "$RUNNER_TEMP/pm-auth-source" "$RUNNER_TEMP/pm-auth-tmp" "$RUNNER_TEMP/pm-auth-target"
          rm -f -- "$RUNNER_TEMP/swagger.zip" "$RUNNER_TEMP/pm-auth-evidence/consumer.log"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fleet-control/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          path: fleet-control
      - name: Read pinned Base revision
        id: base
        working-directory: fleet-control
        run: echo "sha=$(cat .base-revision)" >> "$GITHUB_OUTPUT"
      - name: Check out services-base sibling (@sdlc/ui file dep)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          ref: ${{ steps.base.outputs.sha }}
      - name: Verify pinned Base checkout
        working-directory: fleet-control
        run: python3 ../services-base/scripts/verify_base_revision.py --revision .base-revision --base ../services-base
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          cache: pnpm
          cache-dependency-path: fleet-control/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        env:
          CI: "true"
      - run: pnpm openapi:check
      - run: pnpm chat:contract
      - run: pnpm chat:evidence:verify
      - name: Install shared UI validator dependencies
        run: pnpm --dir ../../services-base/frontend install --frozen-lockfile
        env:
          CI: "true"
      - run: pnpm ui:check
      - run: pnpm markdown:check
      - run: pnpm screenshots:verify
      - run: pnpm typecheck
      - run: pnpm test -- --run
      - run: pnpm lint
      - name: OpenAPI compatibility against target branch
        run: |
          git fetch origin main --depth=1
          pnpm openapi:compat
      - name: Generated contract and lockfile stay unchanged
        run: git diff --exit-code -- pnpm-lock.yaml src/api/generated.ts src/api/schema.d.ts
      - run: pnpm build
      - name: Packed Base consumer
        run: python ../../services-base/scripts/check_ui_consumer.py
      - name: Effective themes in the built consumer
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/theme-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; wait "$preview_pid" 2>/dev/null || true' EXIT
          pnpm theme:check http://127.0.0.1:4173

      - run: pnpm format:check
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Three-browser fixture acceptance
        run: pnpm exec playwright test
      - name: Capture current fixture screens
        run: pnpm screenshots:local
      - name: Verify generated screenshot manifest
        run: pnpm screenshots:verify
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fleet-browser-evidence
          path: |
            fleet-control/frontend/test-results
            fleet-control/docs/assets/screens
          retention-days: 14

  minimum-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: fleet-control
      - name: Read pinned Base revision
        id: base
        working-directory: fleet-control
        run: echo "sha=$(cat .base-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: ${{ steps.base.outputs.sha }}
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - name: Verify pinned Base checkout
        working-directory: fleet-control
        run: python3 ../services-base/scripts/verify_base_revision.py --revision .base-revision --base ../services-base
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fleet-control/backend
      - name: Check declared minimum independently of release builds
        working-directory: fleet-control/backend
        run: cargo check --locked --workspace --all-targets
