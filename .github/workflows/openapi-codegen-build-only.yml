name: OpenAPI Codegen Build Only

on:
  push:
    branches: [build-only/fleet-openapi-pm-union-20261010]

permissions:
  contents: read

concurrency:
  group: fleet-openapi-codegen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codegen:
    if: github.repository == 'FerrPOINT/fleet-control' && github.event_name == 'push' && github.ref == 'refs/heads/build-only/fleet-openapi-pm-union-20261010' && github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RUSTUP_TOOLCHAIN: "1.88.0"
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Check out reviewed build controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: controls
          fetch-depth: 0
          persist-credentials: false
      - name: Restrict branch delta before accessing Base
        run: python3 -B controls/scripts/openapi_codegen.py preflight
      - name: Check out exact Fleet source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: f7d586be10a958f4f454c357831018250c779256
          path: fleet-control
          fetch-depth: 2
          persist-credentials: false
      - name: Check out pinned Base using existing read token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: FerrPOINT/services-base
          ref: 19a7a381ae6dbea61a643bb96189e483fa64df5c
          path: services-base
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          test "$(rustc --version | awk '{print $2}')" = 1.88.0
          pkg-config --exists openssl
      - name: Generate OpenAPI from immutable Git exports
        run: python3 -B controls/scripts/openapi_codegen.py generate
      - name: Retain schema and provenance only
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fleet-openapi-pm-union-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fleet-openapi-evidence/openapi.json
            ${{ runner.temp }}/fleet-openapi-evidence/provenance.json
            ${{ runner.temp }}/fleet-openapi-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          archive: true
          overwrite: false
          include-hidden-files: false
      - name: Record immutable artifact identity for readback
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            printf 'Source: `%s`\n\n' f7d586be10a958f4f454c357831018250c779256
            printf 'Workflow commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Run/attempt: `%s/%s`\n\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Artifact ID: `%s`\n\n' "$ARTIFACT_ID"
            printf 'Artifact ZIP SHA-256: `%s`\n\n' "$ARTIFACT_DIGEST"
            printf 'Artifact: %s\n\n' "$ARTIFACT_URL"
            printf 'Codegen evidence only; backend quality gates and SDLC acceptance remain separate.\n'
          } >> "$GITHUB_STEP_SUMMARY"
