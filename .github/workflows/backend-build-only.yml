name: Exact Source Backend Build Only

on:
  push:
    branches: [build-only/fleet-backend-98d950e-20261009]

permissions:
  contents: read

concurrency:
  group: fleet-backend-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    if: github.repository == 'FerrPOINT/fleet-control' && github.event_name == 'push' && github.ref == 'refs/heads/build-only/fleet-backend-98d950e-20261009' && github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    container:
      image: rust:1.88.0-bookworm
      options: --cpus 2 --memory 4g
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: fleet_test
          POSTGRES_DB: fleet_foundation_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --cpus 1 --memory 512m
          --health-cmd "pg_isready -U fleet_test -d fleet_foundation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RUSTUP_TOOLCHAIN: "1.88.0"
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Install control prerequisites without private inputs
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3 git pkg-config libssl-dev postgresql-client curl unzip
      - name: Check out reviewed build controls
        id: controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: controls
          fetch-depth: 0
          persist-credentials: false
      - name: Restrict exact branch delta before accessing Base tokens
        run: python3 -B controls/scripts/hosted_backend_gate.py preflight
      - name: Check out exact Fleet source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: c02ee920a6ba8028038ffc24a293dd8de95bf731
          path: fleet-control
          persist-credentials: false
      - name: Check out pinned build SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: FerrPOINT/services-base
          ref: 19a7a381ae6dbea61a643bb96189e483fa64df5c
          path: services-base
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          persist-credentials: false
      - name: Check out qualified real Auth separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: FerrPOINT/services-base
          ref: 01388dfb43332cbe5837fd5e1fadccf09cb8886d
          path: base-auth-source
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          persist-credentials: false
      - name: Require exact compiler and QA components
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = 1.88.0
          rustup component add --toolchain 1.88.0 rustfmt clippy
          pkg-config --exists openssl
      - name: Full exact-source backend Linux PostgreSQL gate
        id: gate
        run: python3 -B controls/scripts/hosted_backend_gate.py execute
      - name: Final owned scratch cleanup fallback
        if: always() && steps.controls.outcome == 'success'
        run: python3 -B controls/scripts/hosted_backend_gate.py cleanup
      - name: Retain explicitly safe compiler failure evidence only
        if: failure() && steps.gate.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fleet-backend-failure-98d950e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fleet-backend-failure-evidence/compiler-diagnostics.json
          if-no-files-found: warn
          retention-days: 14
          archive: true
          overwrite: false
          include-hidden-files: false
      - name: Retain safe full backend report and provenance only
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fleet-backend-98d950e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fleet-backend-evidence/report.json
            ${{ runner.temp }}/fleet-backend-evidence/provenance.json
            ${{ runner.temp }}/fleet-backend-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          archive: true
          overwrite: false
          include-hidden-files: false
      - name: Record immutable gate artifact identity
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            printf 'Source: `%s`\n\n' c02ee920a6ba8028038ffc24a293dd8de95bf731
            printf 'Workflow commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Run/attempt: `%s/%s`\n\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Artifact ID: `%s`\n\n' "$ARTIFACT_ID"
            printf 'Artifact ZIP SHA-256: `%s`\n\n' "$ARTIFACT_DIGEST"
            printf 'Artifact: %s\n\n' "$ARTIFACT_URL"
            printf 'Full backend gate only; frontend, native runtime and SDLC acceptance remain separate.\n'
          } >> "$GITHUB_STEP_SUMMARY"
